name: Generate GPT Voxel Catalog
on:
  push:
    branches:
      - gpt/complete-catalog
    paths:
      - tools/gpt_catalog_foundry.py
      - .github/workflows/gpt-catalog-foundry.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-foundry-catalog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/complete-catalog
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Generate and validate editable VOX files and preview images
        run: python tools/gpt_catalog_foundry.py .
      - name: Verify catalog is complete and creator isolation is preserved
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          c=json.loads((root/'catalog.json').read_text())
          records=[m for m in c['models'] if m['id'].startswith('GPT_')]
          assert len(records)==179, f'Expected 179 GPT models, got {len(records)}'
          for m in records:
              assert m['creator']=='GPT' and m['status']=='candidate'
              assert (root/m['source_path']).read_bytes()[:4]==b'VOX '
              assert (root/m['preview_path']).is_file()
              assert (root/m['metadata_path']).is_file()
          print(f'Validated {len(records)} GPT assets with source, metadata and hero PNG.')
          PY
      - name: Commit generated assets to GPT branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models previews catalog.json docs/GPT_catalog_manifest.json gpt_gallery/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Generate 179 GPT voxel candidates and PNG gallery"
            git push origin HEAD:gpt/complete-catalog
          fi
